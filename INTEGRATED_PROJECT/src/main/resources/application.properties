spring.application.name=demo
server.port=8080

# Keep a player's runs (lives, timers, progress) for an hour of inactivity.
server.servlet.session.timeout=60m

# Templates reload while you edit them (set to true for production).
spring.thymeleaf.cache=false

# ---- Zombie mission rules (every zombie scenario uses these) ----
escape.zombie.lives=3
escape.zombie.time-limit-seconds=300
escape.zombie.hint-penalty-seconds=20
escape.zombie.max-hints-per-puzzle=3
