<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shared fragments</title></head>
<body>

<!-- Common header: brand + SOUND toggle + HOME (same on every scenario) -->
<header class="site-header" th:fragment="header">
    <div class="header-inner">
        <a class="brand" href="/" th:href="@{/}"><span class="mark">&#9672;</span><span class="brand-text">DIGITAL ESCAPE ROOM</span></a>
        <nav class="nav" aria-label="Main navigation">
            <button type="button" class="btn btn-secondary btn-small" id="btn-sound" data-bgm-toggle aria-pressed="true">&#128266; SOUND ON</button>
            <a class="btn btn-secondary btn-small" href="/" th:href="@{/}">&#8962; HOME</a>
        </nav>
    </div>
</header>

<!-- Common footer: DIGITAL ESCAPE ROOM • Zombie Mission • 2026 Digital Escape Room Team -->
<footer class="site-footer" th:fragment="footer(showMenu)">
    <div class="footer-inner">
        <p class="footer-line">
            <span class="footer-brand"><span aria-hidden="true">&#9672; </span><span th:text="${footerBrand}">DIGITAL ESCAPE ROOM</span></span>
            <span class="dot" aria-hidden="true">&bull;</span>
            <span th:text="${footerSubtitle}">Zombie Mission</span>
            <span class="dot" aria-hidden="true">&bull;</span>
            <span th:text="${footerTeam}">2026 Digital Escape Room Team</span>
        </p>
        <a class="btn btn-secondary btn-small" href="/" th:href="@{/}" th:if="${showMenu}">&larr; MAIN MENU</a>
    </div>
</footer>

</body>
</html>
