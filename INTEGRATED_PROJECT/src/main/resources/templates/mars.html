<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Mars Mission')}"></head>
<body th:data-bgm-src="@{/sounds/music/the-way-out-15s.mp3}" data-bgm-src="/sounds/music/the-way-out-15s.mp3" class="theme-mars"
      th:data-ambient="@{/sounds/spacecraft/ambient.mp3}"
      th:data-sound-base="@{/sounds}">
    <th:block th:replace="~{fragments/bgm :: audio}"></th:block>

  <div th:replace="~{fragments/layout :: background('mars')}"></div>

  <div class="page">
    <div th:replace="~{fragments/layout :: header(@{/spacecraft}, '← Destinations')}"></div>

    <th:block th:replace="~{fragments/mission :: mission('mars', 'Mars', 'Red Planet Expedition', 'Your crew landed on Mars three days ago. A dust storm is closing in, the habitat is losing power, and every system you touch could save or doom the mission. Read each situation and make the right call.', 'You restored power, secured the habitat and reached the ascent vehicle. The crew is safe.', 'The habitat lost power and the crew could not be saved. The Red Planet claimed the mission.')}"></th:block>
  </div>

  <script th:src="@{/js/game.js}"></script>
  <script th:src="@{/js/spacecraft.js}"></script>
    <script th:src="@{/js/bgm.js}"></script>
</body>
</html>
